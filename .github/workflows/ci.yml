name: CI · lint + typecheck + build

# Why this exists:
#
#   On 20 May 2026 a commit (`a5e2634`) shipped a new route
#   (/jeecup-counselling) with three TypeScript errors — the JSX used
#   `<PhoneIcon size={16}>` and `<WhatsAppIcon size={16}>` where those
#   icons don't accept a `size` prop. Vercel's build silently failed,
#   the previous deployment stayed live, and production returned 404
#   for the new route until a hotfix went in.
#
#   This workflow runs `npx tsc --noEmit` + `npm run lint` +
#   `npm run build` on every push and PR so the same class of error
#   fails loudly in GitHub's PR check UI, before Vercel ever tries.
#
# Triggers:
#   - push to main          (catch issues that landed already)
#   - pull_request           (catch issues before merge, ANY base branch)
#   - workflow_dispatch      (manual re-run without pushing)
#
#   `pull_request` deliberately carries no `branches:` filter. That filter
#   matches the BASE branch, so a stacked PR — one opened against another
#   feature branch rather than against main — got no checks at all. That
#   happened on 6 Sep 2026: PR #6 sat on PR #5's branch and never ran
#   typecheck or build, which meant the larger and riskier of the two
#   changes was the one going unverified. Retargeting a PR to main does not
#   rescue it either: changing the base fires `pull_request: edited`, and
#   the default activity types are opened / synchronize / reopened, so no
#   run is queued until the next push. Running on every PR regardless of
#   base costs a couple of runner minutes and removes the whole trap.
#
# Cost:
#   - Runs ~2 minutes on a public-repo GitHub-hosted runner.
#   - Free under the 2,000-minute / month limit for personal accounts.
#
# ESLint (added 6 Sep 2026):
#
#   This block used to say ESLint was deliberately excluded because it
#   "currently fails on a backlog of legacy warnings. Add later as a
#   separate workflow once the backlog is cleared." The backlog is now
#   cleared — 65 errors to 0 — so that condition is met and the plan is
#   carried out here.
#
#   It lands as a step in this job rather than as a separate workflow:
#   a second workflow would repeat the checkout, the Node setup and a
#   full `npm ci` to save nothing, and would report as a second check
#   with the same pass/fail meaning.
#
#   `npm run lint` fails the job on ESLint ERRORS only. Warnings do not
#   affect its exit code, and three are currently expected — all
#   react-hooks/incompatible-library, reporting that react-hook-form's
#   and TanStack Table's APIs return values the React Compiler cannot
#   memoize. Those are third-party interop facts rather than defects
#   here, and they will clear when those libraries ship compiler-
#   compatible releases. Do NOT add --max-warnings 0 to make them fail
#   without first clearing them, or CI goes red on something this repo
#   cannot fix.
#
# What it does NOT do (intentionally):
#   - Run component or end-to-end tests — neither exists yet. The unit suite
#     added 6 Sep 2026 covers pure logic in lib/ only; TESTING.md lists the
#     gaps, which are real: nothing here proves a button renders or a form
#     submits.
#   - Deploy. Vercel handles deploys; this workflow only validates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck-and-build:
    # The job name is the string GitHub shows as the check, and is what a
    # required-status-check setting would refer to. It is deliberately left
    # as-is now that this job also lints, so no branch-protection rule
    # silently stops matching. Rename it and the setting together.
    name: Typecheck + Next build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          # Match local + Vercel's Node 22 default for Next 16
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        # The actual failure mode that motivated this workflow: a
        # TypeScript error in a new page silently breaks the Vercel
        # build. `tsc --noEmit` catches the same error in ~30 seconds.
        run: npx tsc --noEmit

      - name: ESLint
        # Runs after typecheck so the more severe failure reports first,
        # and before the build because it is much the cheaper of the two.
        # See the ESLint note in the header for what does and does not
        # fail this step.
        run: npm run lint

      - name: Unit tests
        # Pure-logic suite (Vitest). Runs in about a second; see TESTING.md for
        # what it covers and, more importantly, what it does not.
        run: npm test

      - name: Next.js build
        # Belt-and-suspenders — catches anything tsc misses (Next
        # config errors, missing env vars at build time, etc.).
        env:
          # Match Vercel build environment; keeps Image domains etc.
          # consistent. Add new prod-build env vars here as they are
          # introduced.
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dg8sty5ej
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: bipe_admin
        run: npm run build
