# Daily refresh of Google reviews → lib/reviews.json
#
# Calls Google Places API (New) via scripts/fetch-google-reviews.mjs,
# writes the result to lib/reviews.json, commits if the data changed,
# and triggers a Vercel redeploy through the normal push-to-main path.
#
# REQUIRED GITHUB SECRETS  (Settings → Secrets and variables → Actions):
#   GOOGLE_PLACES_API_KEY   API key from Google Cloud Console with
#                            Places API (New) enabled.
#   GOOGLE_PLACES_PLACE_ID  BIPE Place ID. Find via:
#                            https://developers.google.com/maps/documentation/
#                              places/web-service/place-id
#                            Looks like ChIJN1t_tDeu...
#
# Manual trigger: Actions tab → "Refresh Google reviews" → Run workflow.
# Cron: 04:30 UTC = 10:00 IST (after the website's audience is most
# likely to leave overnight reviews).

name: Refresh Google reviews

on:
  schedule:
    - cron: "30 4 * * *"  # daily at 04:30 UTC / 10:00 IST
  workflow_dispatch:       # allow manual trigger from the Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need a token that can push back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch reviews from Google Places API
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACES_PLACE_ID: ${{ secrets.GOOGLE_PLACES_PLACE_ID }}
          REVIEW_MIN_RATING: "4"
          REVIEW_KEEP_COUNT: "6"
        run: node scripts/fetch-google-reviews.mjs

      - name: Commit & push if data changed
        run: |
          if [ -n "$(git status --porcelain lib/reviews.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/reviews.json
            git commit -m "chore(reviews): daily refresh of Google reviews

          Auto-generated by .github/workflows/refresh-reviews.yml.
          See scripts/fetch-google-reviews.mjs for the fetch logic."
            git push
          else
            echo "No review changes detected. Skipping commit."
          fi
