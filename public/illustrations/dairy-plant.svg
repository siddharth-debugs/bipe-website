<?xml version="1.0" encoding="UTF-8"?>
<!--
  Minimalist illustration: Dairy pilot plant.
  Concept: storage tank with inflow + outflow pipes and a pressure gauge.
  Used as a CrossfadeSlider slide on /courses/dairy-engineering.
  See dairy-processing.svg for the rationale and palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Dairy pilot plant — storage tank with inflow and outflow pipes">
  <rect width="800" height="600" fill="#fafafa"/>

  <!-- subtle grid hint -->
  <g opacity="0.04">
    <line x1="0" y1="150" x2="800" y2="150" stroke="#283e7a" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#283e7a" stroke-width="1"/>
    <line x1="0" y1="450" x2="800" y2="450" stroke="#283e7a" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="600" stroke="#283e7a" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="600" stroke="#283e7a" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="600" stroke="#283e7a" stroke-width="1"/>
  </g>

  <!-- pipes (drawn first, so tank covers their junctions) -->
  <line x1="60" y1="250" x2="290" y2="250" stroke="#c8a951" stroke-width="8" stroke-linecap="round"/>
  <line x1="510" y1="350" x2="740" y2="350" stroke="#c8a951" stroke-width="8" stroke-linecap="round"/>
  <circle cx="60" cy="250" r="18" fill="#c8a951"/>
  <circle cx="740" cy="350" r="18" fill="#c8a951"/>

  <!-- main cylindrical tank body -->
  <rect x="280" y="160" width="240" height="280" rx="14" fill="#ffffff" stroke="#283e7a" stroke-width="6"/>
  <!-- tank top + bottom ellipses for 3D feel -->
  <ellipse cx="400" cy="160" rx="120" ry="20" fill="#ffffff" stroke="#283e7a" stroke-width="6"/>
  <ellipse cx="400" cy="440" rx="120" ry="20" fill="none" stroke="#283e7a" stroke-width="6"/>

  <!-- centred pressure gauge -->
  <circle cx="400" cy="300" r="44" fill="#ffffff" stroke="#283e7a" stroke-width="5"/>
  <circle cx="400" cy="300" r="3" fill="#283e7a"/>
  <line x1="400" y1="300" x2="425" y2="278" stroke="#283e7a" stroke-width="4" stroke-linecap="round"/>
  <!-- gauge tick marks -->
  <line x1="400" y1="262" x2="400" y2="270" stroke="#283e7a" stroke-width="2"/>
  <line x1="368" y1="300" x2="376" y2="300" stroke="#283e7a" stroke-width="2"/>
  <line x1="424" y1="300" x2="432" y2="300" stroke="#283e7a" stroke-width="2"/>

  <!-- mono label -->
  <text x="400" y="540" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="middle" fill="#283e7a" letter-spacing="6">PILOT PLANT · संयंत्र</text>
</svg>
