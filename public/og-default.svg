<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: BIPE brand-aligned navy gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a3f"/>
      <stop offset="100%" stop-color="#13235a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#e89c4f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e89c4f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="170" fill="#e89c4f" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="6" font-weight="700">
    BIPE · VARANASI · SINCE 2010
  </text>

  <!-- Main title -->
  <text x="80" y="290" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="80" font-weight="700" letter-spacing="-2">
    Banaras Institute of
  </text>
  <text x="80" y="380" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="80" font-weight="700" letter-spacing="-2">
    Polytechnic &amp; Engineering
  </text>

  <!-- Italic accent line -->
  <text x="80" y="455" fill="#e89c4f" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="46" font-weight="400">
    AICTE Polytechnic · JEECUP Code 4455
  </text>

  <!-- Footer pill row -->
  <g transform="translate(80, 540)" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="3" font-weight="600">
    <text fill="#ffffff" fill-opacity="0.65">AICTE-APPROVED</text>
    <text x="240" fill="#ffffff" fill-opacity="0.65">·</text>
    <text x="260" fill="#ffffff" fill-opacity="0.65">BTEUP-AFFILIATED</text>
    <text x="500" fill="#ffffff" fill-opacity="0.65">·</text>
    <text x="520" fill="#ffffff" fill-opacity="0.65">5 BRANCHES</text>
    <text x="680" fill="#ffffff" fill-opacity="0.65">·</text>
    <text x="700" fill="#ffffff" fill-opacity="0.65">1,200+ PLACED</text>
  </g>

  <!-- bipevns.org bottom-right -->
  <text x="1120" y="585" fill="#e89c4f" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="3" text-anchor="end" font-weight="700">
    bipevns.org
  </text>
</svg>
